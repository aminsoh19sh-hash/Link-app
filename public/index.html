<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>مدير روابط التطبيقات</title>
  <script>
    // تطبيق الثيم واللغة المحفوظين قبل الرسم لتفادي الوميض
    (function () {
      try {
        var d = document.documentElement;
        var th = localStorage.getItem('theme');
        if (!th) th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var lg = localStorage.getItem('lang') === 'en' ? 'en' : 'ar';
        d.dataset.theme = th;
        d.lang = lg;
        d.dir = lg === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="top">
      <h1 class="title">
        <span class="logo">📦</span>
        <span class="title-text" data-i18n="title"></span>
      </h1>

      <div class="tools">
        <button id="langBtn" class="icon-btn" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span id="langLabel">EN</span>
        </button>

        <button id="themeBtn" class="icon-btn" type="button">
          <span class="theme-ico" aria-hidden="true">
            <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
        </button>

        <button id="refreshBtn" class="icon-btn" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          <span data-i18n="refresh"></span>
        </button>
      </div>
    </header>

    <section class="stats">
      <div class="stat s1">
        <div class="stat-ico">📱</div>
        <div>
          <div class="stat-label" data-i18n="statCount"></div>
          <div class="stat-value"><span class="num-big" id="statCount">0</span></div>
        </div>
      </div>
      <div class="stat s2">
        <div class="stat-ico">💾</div>
        <div>
          <div class="stat-label" data-i18n="statSize"></div>
          <div class="stat-value"><span class="num-big" id="statSize">0 B</span></div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" id="search" data-i18n-ph="search" autocomplete="off">
      </div>
      <div class="filters" id="filters"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th data-i18n="th_name"></th>
              <th data-i18n="th_date"></th>
              <th data-i18n="th_size"></th>
              <th data-i18n="th_link"></th>
              <th data-i18n="th_del"></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="empty" class="empty hidden"><div class="empty-ico">📂</div><p id="emptyText"></p></div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
