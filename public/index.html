<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مدير روابط التطبيقات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="top">
      <h1>📦 مدير روابط التطبيقات</h1>
      <button id="refreshBtn" class="btn">⟳ تحديث</button>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">عدد التطبيقات</div>
        <div class="stat-value" id="statCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">الحجم الكلي</div>
        <div class="stat-value" id="statSize">0 B</div>
      </div>
    </section>

    <section class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="🔍 ابحث باسم التطبيق...">
      </div>
      <div class="filters" id="filters"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>اسم التطبيق الأصلي</th>
              <th>تاريخ ووقت النشر</th>
              <th>الحجم</th>
              <th>الرابط</th>
              <th>حذف</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p id="empty" class="hint hidden"></p>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
