*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;transition:background .3s,color .3s;overflow-x:hidden}

a{color:inherit}button,input,select{font:inherit;color:inherit}
.wrap{max-width:1140px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.3rem;text-decoration:none}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;font-style:normal;box-shadow:0 8px 20px -6px var(--blue)}
nav{display:flex;gap:4px;margin-inline:auto}nav a{padding:6px 12px;border-radius:10px;text-decoration:none;color:var(--mut);font-weight:600;font-size:.95rem}nav a:hover{background:var(--line);color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.ico,.sel{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;padding:0 12px}.ico{width:40px;padding:0}
.btn{border:0;cursor:pointer;border-radius:14px;padding:12px 26px;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 12px 28px -10px var(--blue);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}.btn.gold{background:var(--gold);color:#241a00;box-shadow:0 12px 28px -10px var(--gold)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 14px;border-radius:10px;font-size:.85rem}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}
section{padding:80px 0}h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.2;font-weight:900}h2{font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:900;margin-bottom:28px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:60px}
.hero p{color:var(--mut);font-size:1.15rem;margin:18px 0 28px;max-width:52ch}
.route{background:var(--bg2);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:var(--sh)}
.route svg{width:100%;height:auto}.dash{stroke-dasharray:6 8;animation:mv 1.2s linear infinite}@keyframes mv{to{stroke-dashoffset:-14}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--sh)}.card b{font-size:1.1rem}.card p{color:var(--mut);font-size:.95rem}.card .e{font-size:2rem;display:block}
.card:nth-child(2n){border-radius:22px 22px 22px 6px}
details{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:10px}summary{cursor:pointer;font-weight:700}details p{color:var(--mut);margin-top:8px}
.form{max-width:560px;margin:auto;display:grid;gap:14px}
label{font-weight:700;font-size:.9rem}input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);outline:0}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 4px #2a3cd926}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.thanks{text-align:center;padding:40px;border-radius:28px;background:linear-gradient(135deg,var(--blue),#1a24a0);color:#fff;max-width:560px;margin:auto}.thanks .e{font-size:3.4rem;animation:pop .6s}@keyframes pop{from{transform:scale(0)}}
.order{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}.order .a{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 12px;border-radius:99px;font-size:.8rem;font-weight:800}.b-accepted,.b-accept{background:#12a36b26;color:var(--ok)}.b-waiting,.b-wait{background:#e29a0026;color:var(--warn)}.b-rejected,.b-reject{background:#d93a4a26;color:var(--bad)}
footer{border-top:1px solid var(--line);padding:36px 0;color:var(--mut);text-align:center;font-size:.9rem}
#splash{position:fixed;inset:0;z-index:100;background:var(--blue);color:#fff;display:grid;place-items:center;text-align:center;transition:opacity .6s,visibility .6s}
#splash .t{font-size:5rem;animation:drive 1.6s ease-in-out infinite}@keyframes drive{50%{transform:translateX(30px)}}
#gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:20px}.gate{max-width:440px;width:100%;text-align:center}.gate .card{margin-top:20px;display:grid;gap:12px;text-align:start}
.hide{opacity:0;visibility:hidden;pointer-events:none}[hidden]{display:none!important}
.burger{display:none}
@media(max-width:860px){.hero{grid-template-columns:1fr}nav{display:none;position:absolute;top:68px;inset-inline:0;flex-direction:column;background:var(--bg2);padding:12px;border-bottom:1px solid var(--line)}nav.open{display:flex}.burger{display:grid}.bar .btn.sm{display:none}section{padding:56px 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:14px}.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:800;cursor:pointer}.tabs .on{background:var(--bg2);box-shadow:var(--sh)}.msg{text-align:center;padding:40px 24px;border-radius:28px;max-width:560px;margin:auto}.msg .e{font-size:3.4rem}.msg.bad{background:#d93a4a1f;border:1px solid var(--bad)}.msg.wait{background:linear-gradient(135deg,var(--blue),#1a24a0);color:#fff}
body[data-view=driver] nav,body[data-view=driver] .cta-h{display:none!important}body[data-view=home] #logout,body[data-view=home] #homeBtn{display:none!important}

const ALL={};['ar','fr','en'].forEach(l=>ALL[l]={...DH[l],...DD[l]});
ALL.ar.e_net='تعذّر الاتصال بالسيرفر، تحقق من العنوان عبر ⚙ API';ALL.fr.e_net='Connexion au serveur impossible, vérifiez ⚙ API';ALL.en.e_net='Cannot reach the server, check ⚙ API';
initCommon(ALL);
$('#cfg').onclick=()=>{const v=prompt('API URL',API_BASE);if(v){localStorage.api=v.trim();location.reload()}};
function view(){const v=location.hash.startsWith('#/driver')?'driver':'home';document.body.dataset.view=v;$('#vHome').hidden=v!=='home';$('#vDriver').hidden=v!=='driver';scrollTo(0,0)}
addEventListener('hashchange',view);view();
$$('[data-s]').forEach(a=>a.onclick=e=>{e.preventDefault();$('#nav').classList.remove('open');if(document.body.dataset.view!=='home')location.hash='#/';setTimeout(()=>document.getElementById(a.dataset.s).scrollIntoView({behavior:'smooth'}),60)});

$('#burger').onclick=()=>$('#nav').classList.toggle('open');$$('#nav a').forEach(a=>a.onclick=()=>$('#nav').classList.remove('open'));
setTimeout(()=>$('#splash').classList.add('hide'),1500);


$('#city').innerHTML=CITIES.map(c=>`<option>${c}</option>`).join('');
let MODE='login',ME=null,JUST=false,TOK=localStorage.dtok;
function mode(m){MODE=m;$('#tLogin').classList.toggle('on',m==='login');$('#tReg').classList.toggle('on',m==='reg');
 $$('.r').forEach(e=>e.hidden=m==='login');$('#go').textContent=t(m==='login'?'go_login':'go_reg');$('#err').textContent=''}
$('#tLogin').onclick=()=>mode('login');$('#tReg').onclick=()=>mode('reg');
const call=async(m,u,b)=>{let r;try{r=await fetch(API_BASE+u,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOK},body:b&&JSON.stringify(b)})}catch(e){return {ok:false,j:{error:'net'}}}
 if(r.status===401&&TOK&&u.startsWith('/api/driver/')){out();throw 0}return {ok:r.ok,j:await r.json()}};
$('#form').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';
 const body=MODE==='login'?{email:email.value,password:pass.value}:{fullName:fullName.value,phone:phone.value,city:city.value,address:address.value,email:email.value,password:pass.value};
 const {ok,j}=await call('POST',MODE==='login'?'/api/drivers/login':'/api/drivers',body);
 if(!ok)return $('#err').textContent=t(j.error==='phone'?'e_phone':j.error==='duplicate'?'e_dup':j.error==='account'?'e_acc':j.error==='bad'?'e_bad':j.error==='net'?'e_net':'e_inv');
 TOK=j.token;localStorage.dtok=TOK;JUST=MODE==='reg';pass.value='';load()};
function btns(o){if(o.status==='open')return ['accept','wait','reject'].map(a=>`<button class="btn sm ${a==='accept'?'ok':a==='wait'?'warn':'bad'}" data-o="${o.id}" data-a="${a}">${t(a)}</button>`).join('');
 if(o.driverId!==ME.driver.id)return '';const n=o.status==='accepted'?'picked':o.status==='picked'?'delivered':null;
 return (n?`<button class="btn sm" data-o="${o.id}" data-p="${n}">${t('mk_'+n)}</button>`:'')+`<span class="badge b-accepted">${t('s_'+o.status)}</span>`}
async function load(){const {ok,j}=await call('GET','/api/driver/me');if(!ok)return;ME=j;draw()}
function draw(){if(!ME)return;$('#auth').hidden=true;$('#view').hidden=false;$('#logout').hidden=false;const d=ME.driver;let h='';
 if(d.status==='waiting')h=`<div class="msg wait"><div class="e">${JUST?'✅':'⏳'}</div><h2 style="margin:10px 0">${t(JUST?'th_t':'wait_t')}</h2><p>${t(JUST?'th_p':'wait_p')}</p></div>`;
 else if(d.status==='rejected')h=`<div class="msg bad"><div class="e">😔</div><h2 style="margin:10px 0">${t('rej_t')}</h2><p>${t('rej_p')}</p></div>`;
 else h=`<h2>${t('hi')} ${esc(d.fullName)} 👋</h2><h3 style="margin-bottom:14px">${t('ord_t')}</h3><div class="grid" style="grid-template-columns:1fr">`+(ME.orders.length?ME.orders.map(o=>`<div class="card order"><div><b>${esc(o.ref)} · ${esc(o.product)}</b><p>${esc(o.from)} ➜ ${esc(o.to)} · ${o.price} MAD ${o.mine?`<span class="badge b-${o.mine}">${t(o.mine)}</span>`:''}${o.customer?`<br>👤 ${esc(o.customer)} · ${esc(o.cphone)} · ${esc(o.address)}`:''}</p></div><div class="a">${btns(o)}</div></div>`).join(''):`<p>${t('no_ord')}</p>`)+'</div>';
 $('#view').innerHTML=h}
$('#view').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 const {ok,j}=b.dataset.p?await call('POST',`/api/driver/orders/${b.dataset.o}/progress`,{to:b.dataset.p}):await call('POST',`/api/driver/orders/${b.dataset.o}/respond`,{action:b.dataset.a});if(!ok&&j.error==='taken')alert(t('e_taken'));load()};
function out(){localStorage.removeItem('dtok');TOK=null;ME=null;JUST=false;$('#view').hidden=true;$('#auth').hidden=false;$('#logout').hidden=true;mode('login')}
$('#logout').onclick=out;
window.onLang=()=>{mode(MODE);draw()};
mode('login');if(TOK)load().catch(()=>{});
setInterval(()=>TOK&&ME&&ME.driver.status!=='rejected'&&load().catch(()=>{}),15000);

</script>
